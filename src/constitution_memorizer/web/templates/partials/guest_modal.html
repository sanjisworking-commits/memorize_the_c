<dialog
  class="guest-modal"
  id="guest-signin-modal"
  data-guest-modal
  aria-labelledby="guest-modal-title"
>
  <form method="dialog" class="guest-modal-card">
    <h2 class="guest-modal-title" id="guest-modal-title">Sign in to save your learning</h2>
    <p class="guest-modal-body" data-guest-modal-body>
      Create a personal learning record, continue across devices and receive future revisions.
    </p>
    <div class="guest-modal-actions">
      <a class="btn" data-guest-modal-signin href="/login">Sign in and save it</a>
      <button type="submit" class="btn btn-ghost" data-guest-modal-dismiss>Keep going without saving</button>
    </div>
  </form>
</dialog>
<script type="application/json" id="guest-modal-copy">
{
  "default": "Create a personal learning record, continue across devices and receive future revisions.",
  "mastered": "Signing in saves this Article, its clauses and tomorrow's revision. It counts as 1 of your 3 free Articles — no card needed.",
  "again": "Sign in to schedule this unit again tomorrow on your personal calendar.",
  "note": "Sign in to save memory notes against your account.",
  "visualise": "Sign in to view Visual Explainers."
}
</script>
<script type="application/json" id="guest-modal-titles">
{
  "mastered": "You finished {% if unit is defined and unit.article_number %}Article {{ unit.article_number }}{% else %}this Article{% endif %}. Keep it?"
}
</script>
